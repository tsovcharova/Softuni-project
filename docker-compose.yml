services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: multiplication_db
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d multiplication_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/multiplication_db
      DB_USERNAME: trainer
      DB_PASSWORD: trainer
    ports:
      - "8081:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: