spring.application.name=multiplication-trainer
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/multiplication_db}
spring.datasource.username=${DB_USERNAME:trainer}
spring.datasource.password=${DB_PASSWORD:trainer}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC